<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    This placeholder is replaced by the value of `--base-href` in `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EcoTrack AI — gestión inteligente de residuos sólidos.">
  <meta name="theme-color" content="#2E7D32">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EcoTrack AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EcoTrack AI</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Esqueleto de carga.
    Flutter no puede dibujar nada hasta que el navegador descarga el código de
    la app (en una red lenta, como 3G, puede tardar bastante). Este esqueleto
    es HTML y CSS puro, así que aparece de inmediato y se quita solo cuando
    Flutter pinta su primer cuadro (evento "flutter-first-frame").
  -->
  <style>
    :root {
      --eco-bg: #F7FBF1;
      --eco-primary: #3B683B;
      --eco-tertiary: #39665A;
      --eco-on-primary: #FFFFFF;
      --eco-bone: #E3E8DD;
      --eco-shine: #F1F5EC;
      --eco-text: #42493F;
    }
    .eco-dark {
      --eco-bg: #10140F;
      --eco-primary: #A0D29D;
      --eco-tertiary: #A0D0C1;
      --eco-on-primary: #0A3911;
      --eco-bone: #262C24;
      --eco-shine: #323A2F;
      --eco-text: #C2C9BC;
    }
    html, body { margin: 0; height: 100%; background: var(--eco-bg); }
    #eco-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      background: var(--eco-bg);
      font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
      transition: opacity 0.35s ease;
    }
    #eco-loader.eco-hide { opacity: 0; pointer-events: none; }
    .eco-header {
      height: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding-bottom: 40px;
      box-sizing: border-box;
      color: var(--eco-on-primary);
      background: linear-gradient(135deg, var(--eco-primary), var(--eco-tertiary));
      clip-path: ellipse(140% 100% at 50% 0%);
    }
    .eco-logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--eco-on-primary);
      color: var(--eco-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 8px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }
    .eco-title { font-size: 24px; font-weight: 700; }
    .eco-subtitle { font-size: 14px; opacity: 0.9; }
    .eco-body {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: 16px 24px;
      box-sizing: border-box;
    }
    .eco-bone {
      border-radius: 14px;
      margin-bottom: 16px;
      background: linear-gradient(90deg, var(--eco-bone) 25%, var(--eco-shine) 37%, var(--eco-bone) 63%);
      background-size: 400% 100%;
      animation: eco-shimmer 1.4s ease infinite;
    }
    .eco-bone.title { width: 45%; height: 28px; border-radius: 8px; }
    .eco-bone.text { width: 80%; height: 14px; border-radius: 6px; margin-bottom: 28px; }
    .eco-bone.input { height: 56px; }
    .eco-bone.button { height: 52px; margin-top: 28px; }
    .eco-status {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
      color: var(--eco-text);
    }
    @keyframes eco-shimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .eco-bone { animation: none; }
    }
  </style>
</head>
<body>
  <div id="eco-loader" role="progressbar" aria-busy="true" aria-label="Cargando EcoTrack AI">
    <div class="eco-header">
      <div class="eco-logo" aria-hidden="true">&#9851;</div>
      <div class="eco-title">EcoTrack AI</div>
      <div class="eco-subtitle" id="eco-subtitle">Gestión inteligente de residuos</div>
    </div>
    <div class="eco-body">
      <div class="eco-bone title"></div>
      <div class="eco-bone text"></div>
      <div class="eco-bone input"></div>
      <div class="eco-bone input"></div>
      <div class="eco-bone button"></div>
      <p class="eco-status" id="eco-status">Cargando la aplicación…</p>
    </div>
  </div>

  <script>
    (function () {
      var loader = document.getElementById('eco-loader');
      var status = document.getElementById('eco-status');
      var subtitle = document.getElementById('eco-subtitle');

      // Usa el mismo tema e idioma que el usuario eligió en la app
      // (shared_preferences los guarda en localStorage con el prefijo "flutter.").
      var english = false;
      try {
        var dark = localStorage.getItem('flutter.isDarkMode');
        if (dark === 'true') document.documentElement.classList.add('eco-dark');
        english = localStorage.getItem('flutter.languageCode') === '"en"';
      } catch (e) {}

      var texts = english
        ? { loading: 'Loading the app…', slow: 'The connection is slow. Still loading…', subtitle: 'Smart waste management' }
        : { loading: 'Cargando la aplicación…', slow: 'La conexión está lenta. Seguimos cargando…', subtitle: 'Gestión inteligente de residuos' };
      status.textContent = texts.loading;
      subtitle.textContent = texts.subtitle;

      // Si tarda, se avisa que la red está lenta (por ejemplo en 3G).
      var slowTimer = setTimeout(function () {
        status.textContent = texts.slow;
      }, 8000);

      // Flutter avisa cuando ya dibujó su primera pantalla: se quita el esqueleto.
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(slowTimer);
        loader.classList.add('eco-hide');
        loader.setAttribute('aria-busy', 'false');
        setTimeout(function () { loader.remove(); }, 400);
      });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
